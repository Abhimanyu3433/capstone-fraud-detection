# Optional CD: retrain -> log/register in Azure MLflow -> deploy to the managed endpoint.
# Triggered manually (Actions tab -> "CD - Azure ML" -> Run workflow) so it never runs by accident.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   AZURE_CREDENTIALS      JSON from: az ad sp create-for-rbac --name fraud-cd --role contributor
#                          --scopes /subscriptions/<SUB_ID>/resourceGroups/<RG> --sdk-auth
#   AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, AZURE_ML_WORKSPACE
name: CD - Azure ML

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Deployment slot to (re)deploy"
        default: green
        type: choice
        options: [blue, green]
      traffic:
        description: "Traffic % for the new slot (blue/green rollout)"
        default: "10"

jobs:
  register-and-deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ secrets.AZURE_ML_WORKSPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Tests must pass before deploying
        run: pytest -q
      # The full model is not in git; the workflow logs the committed CI-size model unless a
      # retraining step (src.train on an Azure datastore) is added here.
      - name: Log + register model in Azure MLflow
        run: python -m mlops.track_experiments --register --use-ci-model
      - name: Deploy to managed online endpoint
        run: python -m mlops.deploy_endpoint --slot ${{ inputs.slot }} --traffic ${{ inputs.traffic }}
      - name: Smoke-test endpoint
        run: python -m mlops.test_endpoint --slot ${{ inputs.slot }}
